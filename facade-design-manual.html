<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Leaf through James Watts' Facade Design Manual, presented as a book with the original cover and complete spreads." />
  <meta name="theme-color" content="#ffffff" />
  <title>Facade Design Manual | James Watts</title>
  <link rel="preload" href="assets/facade-manual/page-01.webp" as="image" fetchpriority="high" />
  <link rel="stylesheet" href="facade-manual.css?v=book-1" />
  <script defer src="assets/vendor/page-flip/page-flip.browser.js"></script>
  <script defer src="facade-manual.js?v=book-1"></script>
</head>
<body>
  <a class="back-link" href="index.html#work"><span aria-hidden="true">←</span> Portfolio</a>
  <main class="book-viewer" aria-label="Facade Design Manual book viewer">
    <h1 class="visually-hidden">Facade Design Manual by James Watts</h1>
    <div class="book-stage" id="book-stage">
      <div class="book-position is-front-cover" id="book-position">
        <div class="book-body" aria-hidden="true"></div>
        <div class="manual-book" id="manual-book" aria-label="Book pages. Drag a corner or click a page to turn it."></div>
        <div class="book-gutter" aria-hidden="true"></div>
      </div>
      <p class="loading-note" id="loading-note" role="status">Opening the manual…</p>
    </div>
    <nav class="book-controls" aria-label="Book navigation">
      <button type="button" id="previous-page" aria-label="Previous spread" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <span class="book-status" id="book-status" role="status" aria-live="polite" aria-atomic="true">Cover</span>
      <button type="button" id="next-page" aria-label="Open book"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    </nav>
    <p class="book-hint" id="book-hint">Click the cover to open</p>
    <p class="book-error" id="book-error" role="alert" hidden>We couldn't load this spread. <button type="button" id="retry-spread">Try again</button></p>
    <noscript><p class="noscript-note">Enable JavaScript to flip through the manual. <a href="assets/facade-manual/page-01.webp">View the cover</a>.</p></noscript>
  </main>
</body>
</html>
